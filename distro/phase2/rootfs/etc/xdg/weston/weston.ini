[core]
shell=desktop
idle-time=0
require-input=true
require-outputs=any
xwayland=false

[shell]
background-color=0xff17283d
panel-color=0xff101b2a
panel-position=top
clock-format=minutes-24h
locking=false
animation=none
close-animation=none
startup-animation=none

[output]
name=Virtual-1
mode=1024x768

[keyboard]
keymap_layout=us

[terminal]
font=DejaVu Sans Mono
font-size=14

[launcher]
icon=/usr/share/weston/terminal.png
path=/usr/bin/weston-terminal
