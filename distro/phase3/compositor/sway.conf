# Phase 3: original Wayland shell surfaces on Sway/wlroots.
# Intentionally no stock swaybar or demo launcher. GtkLayerShell owns chrome.
xwayland disable
default_border pixel 2
default_floating_border pixel 2
default_orientation horizontal
focus_follows_mouse no
mouse_warping none
font pango:DejaVu Sans 10
gaps inner 4
gaps outer 0
client.focused #4b8bc6 #4b8bc6 #ffffff #4b8bc6 #4b8bc6
client.unfocused #243649 #243649 #c7d3e0 #243649 #243649
output * mode 1024x768 bg #152437 solid_color
input type:keyboard {
    xkb_layout us
}
# A desktop-like floating window baseline; layer-shell surfaces are independent.
for_window [app_id=".*"] floating enable
for_window [app_id="foot"] resize set 760 530
for_window [app_id="foot"] move position center
set $mod Mod4
bindsym $mod+Return exec /usr/bin/foot
bindsym $mod+Shift+q kill
bindsym $mod+f fullscreen toggle
bindsym $mod+Shift+r reload
# The supervising session starts and monitors the original shell after IPC
# readiness; reloading this config cannot create duplicate Dock instances.
